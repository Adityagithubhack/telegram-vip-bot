services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-telegram_vip}_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telegram_vip}
      POSTGRES_USER: ${POSTGRES_USER:-telegram_vip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telegram_vip_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-telegram_vip} -d ${POSTGRES_DB:-telegram_vip}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-telegram_vip}_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    container_name: ${COMPOSE_PROJECT_NAME:-telegram_vip}_bot
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-telegram_vip}:${POSTGRES_PASSWORD:-telegram_vip_dev_password}@postgres:5432/${POSTGRES_DB:-telegram_vip}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

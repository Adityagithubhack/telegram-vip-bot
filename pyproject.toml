[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-vip-bot"
version = "0.1.0"
description = "Production-grade Telegram premium access bot"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3,<4",
    "aiohttp>=3.9,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "structlog>=24,<26",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "ASYNC",
    "SIM",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
